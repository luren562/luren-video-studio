# Video Foundry 反向代理（宝塔 nginx）
# 应用容器监听 127.0.0.1:8080，本配置把 80 端口反代到应用。
# 若服务器上已有默认站点占用 80，请改用宝塔「网站 → 反向代理」指向 127.0.0.1:8080。
server {
    listen 80;
    listen [::]:80;
    # 显式绑定服务器 IP，确保 http://<IP>/ 命中本块而不是宝塔默认站点
    server_name _;

    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
